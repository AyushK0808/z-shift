[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-ingestion-phase1"
version = "0.1.0"
description = "Phase 1 data ingestion and pre-processing engine for 2D-to-3D generation."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.7.0",
  "pillow>=10.0.0",
  "opencv-python-headless>=4.9.0",
  "numpy<2",
  "exifread>=3.0.0",
  "pyvista>=0.44.0",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "scipy>=1.13.0",
  "einops>=0.7.0",
  "trimesh>=4.0.0",
  "huggingface-hub[torch]>=0.22,<1.0",
  "packaging>=23.0",
  "roma>=1.5.0",
  "tqdm>=4.66.0",
  "scikit-learn>=1.5.0",
  "pyglet<2",
  "matplotlib>=3.11.0",
]

[project.scripts]
zshift-image-to-3d = "spatial_ingestion.reconstruction.cli:main"
spatial-ingestion-refine = "spatial_ingestion.refinement.cli:main"
zshift-final-pipeline = "spatial_ingestion.final_pipeline.cli:main"
zshift-auto-rig = "spatial_ingestion.auto_rigging.cli:main"

# PyPI only ships CPU-only torch wheels on Windows; CUDA builds live on
# PyTorch's own index. Keep the resolution platform-scoped so Windows devs
# get CUDA builds while CI (Linux lint jobs) stays on the lean default index.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.16.0",
  "ty>=0.0.64",
  "pre-commit>=4.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM"]
ignore = [
  "E402",
  "B008",   # FastAPI's Depends()/File() are meant to be called in argument defaults
  "UP042",  # str+Enum kept instead of StrEnum for stable JSON/str serialization
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["S101"]
"src/spatial_ingestion/test_harness/*" = ["S101"]
"src/spatial_ingestion/batch_normalization/ffmpeg_tools.py" = ["S603"]
# Experiment modules print result tables and probe private pipeline
# internals on purpose; that is the job.
"bench/*" = ["S101", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["bench", "spatial_ingestion"]

[tool.ty.environment]
python-version = "3.11"
python-platform = "Linux"

[tool.ty.src]
include = ["src", "tests", "bench"]

[tool.ty.analysis]
# rtree is an optional trimesh extra used only by the exact
# normal-consistency path in bench/metrics.py, which falls back with a clear
# error when it is absent.
allowed-unresolved-imports = ["mast3r.**", "dust3r.**", "rtree"]

[tool.pytest.ini_options]
# "." puts the repo root on sys.path so tests can import the `bench`
# harness, which is a development tree and is deliberately not installed
# as part of the package.
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "real_pipeline: runs the real Phase 2 MASt3R reconstruction and Phase 3 refinement on user-provided images",
]
